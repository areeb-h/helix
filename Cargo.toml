[package]
name = "helix"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Helix — a modern scientific programming language."
license = "MIT"

[[bin]]
name = "helix"
path = "src/main.rs"

[profile.release]
opt-level = 3        # keep speed — Helix is performance-first; do NOT use "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true         # drop debug symbols — pure size win, no perf cost (ADR 0009)

# A fast dev profile that still optimizes dependencies (Polars) so the REPL and
# tests aren't crippled by a debug-built Polars.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
cranelift-codegen = "0.132.2"
cranelift-frontend = "0.132.2"
cranelift-jit = "0.132.2"
cranelift-module = "0.132.2"
cranelift-native = "0.132.2"
ndarray = "0.17.2"
needletail = "0.7.3"
# Spec-compliant genomics parsers (the bio flagship stands on the Rust bio
# ecosystem the way it stands on Polars). VCF gives header-typed INFO fields and
# BGZF; GFF/BED add feature/interval formats. Pure Rust, no system deps.
noodles-vcf = "0.88"
noodles-gff = "0.57"
# Latest Polars — Arrow-columnar, lazy, multi-threaded execution engine.
polars = { version = "0.54", features = [
    "lazy",
    "streaming",
    "csv",
    "parquet",
    "ipc",
    "json",
    "strings",
    "is_in",
    "round_series",
    "cum_agg",
    "dtype-full",
    "performant",
] }
# Fast, deterministic hashing for the interpreter environment.
rustc-hash = "2"
# JSON for `parse_json`/`to_json` — consuming and producing API/data payloads.
# Pure compute, no network, always available (a core data capability).
serde_json = "1"
# Serde derive + TOML for the package manager's manifest (`helix.toml`) and lockfile
# (`helix.lock`). TOML is the hand-edited manifest convention (Cargo/pyproject); the
# lockfile is machine-generated. Core: the package manager is part of the toolchain.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Format- and comment-preserving TOML editing for `helix add` — mutating the
# hand-edited manifest must not destroy the user's comments/layout (a plain
# `toml` re-serialize would). This is the crate Cargo's own `cargo add` uses, and
# `toml` 0.8 is already built on it, so the marginal cost is near-zero.
toml_edit = "0.22"
# CPython interop (Helix -> Python), behind the off-by-default `python` feature so
# the core binary stays self-contained (no libpython dependency unless enabled).
# `abi3-py38` builds against the stable ABI (one build spans Python 3.8+);
# `auto-initialize` lazily starts the interpreter on first use.
pyo3 = { version = "0.28", features = ["auto-initialize", "abi3-py38"], optional = true }
# Zero-copy Rust-Polars <-> Python-Polars interchange (via Arrow). Matches our
# polars 0.54 and pyo3 0.28; used to hand a Helix DataFrame to/from Python.
pyo3-polars = { version = "0.27", optional = true }
# ndarray <-> NumPy bridge. numpy 0.28 unifies on pyo3 ^0.28 and ndarray <=0.17
# (our 0.17); used to hand a Helix Tensor to/from Python's NumPy.
numpy = { version = "0.28", optional = true }

# Verified HTTPS downloads for managed runtimes / packages / toolchains / self-update
# (ADR 0010), behind the `managed` feature so the pure core stays dependency-free.
# rustls (not OpenSSL) keeps the binary self-contained; sha2 is the trust boundary.
ureq = { version = "2", optional = true }
# Content hashing — core, because the package manager's lockfile pins every
# dependency by sha256 (the integrity/reproducibility property), and the managed
# downloader verifies hashes before extract (ADR 0010).
sha2 = "0.10"
# Pure-Rust gzip (miniz_oxide backend — no zlib system dep, keeps the binary
# self-contained). Core, not optional: reading gzipped/BGZF bioinformatics files
# (`.vcf.gz`) is a flagship capability, and the managed-runtime extraction reuses it.
flate2 = "1"
# tar extraction — core, because the package manager unpacks verified remote
# dependency tarballs (https sources) into the content-addressed cache, and the
# managed-runtime extraction reuses it. Pure Rust, no system dep.
tar = "0.4"

[features]
# HTTP data-fetching is on by default (a core scientific capability); build with
# `--no-default-features` for a network-free binary on locked-down machines.
default = ["http"]
# `http_get` — fetch data over HTTP(S) from a Helix program.
http = ["dep:ureq"]
# Enable the embedded-CPython bridge: `cargo build --features python`.
python = ["dep:pyo3", "dep:pyo3-polars", "dep:numpy"]
# Managed runtimes: verified downloads + extraction (managed Python, etc.).
managed = ["http"]
