[package]
name = "helix"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "Helix — a modern scientific programming language."
license = "MIT"

[[bin]]
name = "helix"
path = "src/main.rs"

[profile.release]
opt-level = 3        # keep speed — Helix is performance-first; do NOT use "z"
lto = "fat"          # whole-program LTO: SHIPPING ONLY (slow, ~4GB single-unit link)
codegen-units = 1
panic = "abort"
strip = true         # drop debug symbols — pure size win, no perf cost (ADR 0009)

# The iteration profile: release-grade `opt-level = 3` (so the differential fuzzers and
# perf tests run at full speed) but WITHOUT fat-LTO + single-codegen-unit, which is what
# made `cargo test --release` take ~20 min and ~4 GB in one rustc (whole-program LTO of
# Polars/noodles/cranelift on every build). Dropping LTO and parallelising codegen makes
# a rebuild minutes-faster and memory-light, at a negligible (~few %) runtime cost that
# does not affect any test outcome. `scripts/gate.sh` uses this; `release` stays the
# shipping profile. Invoke with `cargo test --profile gate` / `cargo build --profile gate`.
[profile.gate]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false        # keep symbols so a test panic gives a real backtrace

# A fast dev profile that still optimizes dependencies (Polars) so the REPL and
# tests aren't crippled by a debug-built Polars.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
cranelift-codegen = "0.132.2"
cranelift-frontend = "0.132.2"
cranelift-jit = "0.132.2"
cranelift-module = "0.132.2"
cranelift-native = "0.132.2"
ndarray = "0.17.2"
# Exact arbitrary-precision rationals (reuses num-bigint, already in the tree via
# polars) for the Rational value type - exact coefficients (PSLQ/lll), fractions.
num-rational = "0.4"
num-traits = "0.2"
# URL parsing for redirect origin comparison (ADR 0031). Already in the tree as a
# ureq transitive dep; made direct because credential-stripping correctness must not
# rest on a hand-rolled scheme/host/port parser — that is exactly where these bugs live.
url = "2"
# The Public Suffix List (Mozilla), embedded as a generated match tree — the supercookie
# defence for the ADR 0031 cookie jar. "embed a snapshot" per the ADR; the crate carries
# the list revision, so its staleness is visible rather than silent.
psl = "2"
num-bigint = "0.4"
needletail = "0.7.3"
# Spec-compliant genomics parsers (the bio flagship stands on the Rust bio
# ecosystem the way it stands on Polars). VCF gives header-typed INFO fields and
# BGZF; BCF is its binary form (same record model); GFF/BED add feature/interval
# formats. Pure Rust, no system deps. The BCF version is pinned to the one that
# depends on noodles-vcf 0.88 so a single copy of each noodles crate is resolved.
noodles-vcf = "0.88"
noodles-bcf = "0.86"
noodles-gff = "0.57"
# SAM/BAM sequence alignments (the most common post-FASTQ format). BAM is the
# binary, BGZF-framed form of SAM; noodles yields the same alignment RecordBuf for
# both, so read_sam/read_bam share one column-building core. Versions pinned to the
# set that depends on the noodles-core/bgzf/csi already in the tree (single copy).
noodles-sam = "0.85"
noodles-bam = "0.90"
# Genomic region/interval types (`Region` = "chr17:43k-44k") for indexed region
# queries — read just the variants in a region from a bgzipped+tabix-indexed VCF
# without scanning the whole file (the local-first capability). Pinned to the copy
# already in the tree. The .tbi index reader lives in noodles-vcf.
noodles-core = "0.20"
# musl's libm, ported to Rust — used ONLY for `erf`/`erfc` (src/stats.rs): the two
# functions Rust's std does not provide, and which a rational approximation cannot
# compute to double precision. Already compiled into this binary via
# cranelift-codegen and faer, so this adds a dependency EDGE, not a new crate.
libm = "0.2"
# Latest Polars — Arrow-columnar, lazy, multi-threaded execution engine.
polars = { version = "0.54", features = [
    "lazy",
    "streaming",
    "csv",
    "parquet",
    "ipc",
    "json",
    "strings",
    "is_in",
    "round_series",
    "cum_agg",
    "dtype-full",
    "performant",
] }
# Fast, deterministic hashing for the interpreter environment.
rustc-hash = "2"
# JSON for `parse_json`/`to_json` — consuming and producing API/data payloads.
# Pure compute, no network, always available (a core data capability).
serde_json = "1"
# Serde derive + TOML for the package manager's manifest (`helix.toml`) and lockfile
# (`helix.lock`). TOML is the hand-edited manifest convention (Cargo/pyproject); the
# lockfile is machine-generated. Core: the package manager is part of the toolchain.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Format- and comment-preserving TOML editing for `helix add` — mutating the
# hand-edited manifest must not destroy the user's comments/layout (a plain
# `toml` re-serialize would). This is the crate Cargo's own `cargo add` uses, and
# `toml` 0.8 is already built on it, so the marginal cost is near-zero.
toml_edit = "0.22"
# CPython interop (Helix -> Python), behind the off-by-default `python` feature so
# the core binary stays self-contained (no libpython dependency unless enabled).
# `abi3-py38` builds against the stable ABI (one build spans Python 3.8+);
# `auto-initialize` lazily starts the interpreter on first use.
pyo3 = { version = "0.28", features = ["auto-initialize", "abi3-py38"], optional = true }
# Zero-copy Rust-Polars <-> Python-Polars interchange (via Arrow). Matches our
# polars 0.54 and pyo3 0.28; used to hand a Helix DataFrame to/from Python.
pyo3-polars = { version = "0.27", optional = true }
# ndarray <-> NumPy bridge. numpy 0.28 unifies on pyo3 ^0.28 and ndarray <=0.17
# (our 0.17); used to hand a Helix Tensor to/from Python's NumPy.
numpy = { version = "0.28", optional = true }

# Verified HTTPS downloads for managed runtimes / packages / toolchains / self-update
# (ADR 0010), behind the `managed` feature so the pure core stays dependency-free.
# rustls (not OpenSSL) keeps the binary self-contained; sha2 is the trust boundary.
ureq = { version = "2", optional = true }
# Content hashing — core, because the package manager's lockfile pins every
# dependency by sha256 (the integrity/reproducibility property), and the managed
# downloader verifies hashes before extract (ADR 0010).
sha2 = "0.10"
# HMAC-SHA256 (RustCrypto, composes with sha2 0.10) and base64 — the byte-level
# crypto/encoding primitives a pure-Helix crypto lib can't do correctly (Helix strings
# are UTF-8, so raw-byte XOR / arbitrary-byte base64 need a native, audited path). Same
# "delegate to audited Rust crates" stance as sha2. base64 is already in the tree.
hmac = "0.12"
base64 = "0.22"
# AES-256-GCM authenticated encryption (RustCrypto, constant-time). Exposed with a
# misuse-resistant API only — internal random nonce (OsRng), AEAD (encrypt+authenticate)
# always, so the common footguns (nonce reuse, unauthenticated modes) aren't reachable.
aes-gcm = "0.10"
# Ed25519 signatures (dalek) — the safe asymmetric primitive: deterministic, no nonce
# footgun, no parameter choices. Verify with `verify_strict` (rejects malleable sigs).
# Deliberately NOT RSA / raw-ECDSA (padding-oracle / nonce-reuse footguns).
ed25519-dalek = "2"
# Pure-Rust gzip (miniz_oxide backend — no zlib system dep, keeps the binary
# self-contained). Core, not optional: reading gzipped/BGZF bioinformatics files
# (`.vcf.gz`) is a flagship capability, and the managed-runtime extraction reuses it.
flate2 = "1"
# tar extraction — core, because the package manager unpacks verified remote
# dependency tarballs (https sources) into the content-addressed cache, and the
# managed-runtime extraction reuses it. Pure Rust, no system dep.
tar = "0.4"
faer = "0.24.4"
# Data-parallel elementwise math over large arrays/tensors (already in the tree via
# polars). Gated by a size threshold so small arrays — the hot path — stay sequential.
rayon = "1"
# Fast cross-platform global allocator (ADR 0016). Default-on so every shipped binary
# benefits; the static-musl build needs it because musl's default malloc is a
# documented performance regression (ADR 0009 §8). `default-features = false` selects
# the performance config (no `secure` hardening); the crate is `GlobalAlloc`-only and
# never interposes libc malloc, so it is safe alongside the embedded-CPython `python`
# feature. Disable with `--no-default-features` for allocator debugging.
mimalloc = { version = "0.1", default-features = false, optional = true }
# The raw mimalloc bindings — used only to set `purge_delay = 0` at startup (the
# `mimalloc` crate doesn't expose that option). Same crate `mimalloc` already pulls,
# so no extra version in the tree; v3 is the default build (do NOT enable its `v2`
# feature, which would shift the option enum).
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"], optional = true }
# Unix signal handling — reset SIGPIPE to its default so `helix … | head` terminates
# cleanly instead of panicking on a broken stdout pipe (usage is `#[cfg(unix)]`).
# Already in the tree transitively, so this adds no new crate.
libc = "0.2"

[features]
# HTTP data-fetching and the fast allocator are on by default; build with
# `--no-default-features` for a network-free / system-allocator binary.
default = ["http", "mimalloc"]
# Swap in the mimalloc global allocator (a pure runtime win; see src/main.rs).
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# `http_get` — fetch data over HTTP(S) from a Helix program.
http = ["dep:ureq"]
# Enable the embedded-CPython bridge: `cargo build --features python`.
python = ["dep:pyo3", "dep:pyo3-polars", "dep:numpy"]
# Managed runtimes: verified downloads + extraction (managed Python, etc.).
managed = ["http"]

[dev-dependencies]
# Used only by the ignored `generate_*_index_fixture` tests to build the
# bgzipped + tabix-indexed genomics fixtures from their text sources (no external
# bgzip/tabix needed). Pinned to the copies already in the tree (single version).
noodles-bgzf = "0.47"
noodles-csi = "0.56"
noodles-tabix = "0.62"
