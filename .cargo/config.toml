# Cargo configuration.
#
# musl static builds (the maximum-portability / air-gapped / distroless artifact,
# ADR 0009 §8 + ADR 0016): force a fully-static C runtime so the binary has no shared
# library dependencies at all. Scoped to the musl target ONLY — never put crt-static
# in a global `[build]` rustflags, where it would leak into the glibc/macOS/Windows
# builds and could break them. The mimalloc global allocator (default-on) replaces
# musl's slow default malloc, so the static build stays glibc-fast.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

# Dependency cooldown (Rust 1.100): Cargo picks only crate versions published at least a week
# ago, so a compromised release is usually caught and yanked before it can reach this tree.
# Versions already in Cargo.lock are unaffected. For an urgent security fix that is newer,
# run the update with CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow and say why in the PR.
[registry]
global-min-publish-age = "7 days"
