name: ci

# Until now the ONLY workflow was `release.yml`, which fires on a `v*` tag. Nothing ran on
# a push or a pull request — so the repository opened to contributors with no automated
# checking at all, and a PR could break every engine without CI saying a word. This is the
# first thing a public project needs, ahead of any feature.
#
# It mirrors `scripts/gate.sh` (the local gate) rather than inventing a second definition
# of "green": clippy, the full suite, the parity diff, and the whole-tree type-check. If
# the two ever disagree, the local gate is the one people actually run, so this file
# follows it.
#
# ALL SIX JOBS BLOCK. Three of them shipped advisory — clippy on 9 warnings, MSRV
# unverified, `cargo audit` on 6 advisories — each with a written condition for promotion,
# because asserting an unchecked claim as a gate is how a badge starts lying. Those
# conditions have been met: the clippy warnings are fixed, MSRV was observed green on run
# 31456823902, and audit is green with four unfixable advisories documented in
# `.cargo/audit.toml`. Only `cargo fmt` still reports without blocking, and that one is
# deliberate rather than pending — see the `lint` job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch/PR cancels the previous run — CI minutes are finite even
# when they are free, and a superseded result is not worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback: lints finish in well under a minute, so they run as their own job and a
  # PR gets an answer without waiting for the suite.
  #
  # CLIPPY BLOCKS; RUSTFMT DOES NOT. Both numbers were measured rather than assumed. When
  # this file was written clippy reported 9 warnings, so it shipped advisory with the count
  # recorded as the baseline to drive down — that is now done (collapsible `if`, a byte
  # string, a 4-tuple return type replaced by `F64RangeCaptures`, and `gen_value_typed`'s
  # nine arguments bundled into `TypedCtx`), and `-D warnings` is the gate.
  #
  # rustfmt still reports 1280 diffs, and that is NOT a backlog to burn down — this
  # codebase's comment layout is deliberately hand-wrapped, and reformatting every file for
  # zero functional gain would destroy it. A whole-tree `cargo fmt` is not planned, so the
  # step reports and moves on rather than pretending to be a gate that will one day close.
  lint:
    name: clippy (blocking) + fmt (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: helix-ci
      - name: rustfmt (report only — see the comment above)
        run: cargo fmt --all --check || true
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  # The real gate. `--profile gate` is opt-level 3 without LTO: the differential fuzzers
  # and perf-sensitive tests run at full speed, but a rebuild does not pay the ~20-minute
  # fat-LTO link that `--release` would. Optimization level does not change any test's
  # pass/fail, so this is a faithful gate — see scripts/gate.sh for the reasoning.
  test:
    name: tests + example parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: helix-ci
      - name: Build the binary the parity diff needs
        run: cargo build --profile gate --bin helix
      - name: Test suite
        run: cargo test --profile gate
      # JIT vs tree-walker over every example. Full THREE-engine agreement is covered
      # inside `cargo test` above (the pinned corpus and the doc-example gate both run
      # all three); this script is the end-to-end diff across real programs.
      - name: Example parity (JIT vs tree-walker)
        run: bash scripts/vmparity.sh
        env:
          BIN: ./target/gate/helix
      # Every gate above RUNS its programs, so none of them can cover a benchmark that
      # needs a generated fixture first — which is how nine `bench/` programs came to
      # still use the `io.`/`bio.`/`stats.` namespaces ADR-0017 removed, and how v0.1.0's
      # release died in its PGO training step. Type-checking needs no fixture, so this
      # covers every tracked `.helix` in ~0.03s. See scripts/checkall.sh.
      - name: Type-check every Helix program in the repo
        run: bash scripts/checkall.sh
        env:
          BIN: ./target/gate/helix
      # 1438 programs written the way someone who does not know Helix would write them —
      # foreign syntax, byte-level malformation, malformed CSVs, DataFrames built from files.
      # Every OTHER generator in the tree emits well-formed Helix from the Helix grammar, so
      # none of them can produce `for x in xs:` or a NUL byte, and none asks whether an error
      # message is any good.
      #
      # Three hard oracles — never-abort, determinism, no-leak — plus a has-help RATCHET.
      # The first is the dynamic complement to the static unwrap budget: it is what catches a
      # panic inside a DEPENDENCY, which is where `read_csv(f).where(1)`'s SIGABRT lived and
      # which the static count structurally cannot see.
      #
      # ~15 s for 12,942 process spawns, against a 25-minute job. It is here rather than in
      # its own job because it needs the binary this job just built.
      - name: Stranger corpus (never-abort / determinism / no-leak / has-help)
        run: python3 scripts/stranger.py --bin ./target/gate/helix

  # The project's stated minimum supported Rust version must actually compile, or the
  # claim in Cargo.toml is decoration. Check only — the suite runs on stable above.
  #
  # BLOCKING as of run 31456823902, which is the condition this job was written with:
  # it shipped advisory because 1.96 building the current dependency tree had never been
  # verified, and asserting an unchecked claim as a gate is how a badge starts lying. It
  # has now been observed green, so the claim is checked and the gate is real.
  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          V=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "MSRV declared as $V"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: helix-msrv
      - run: cargo check --all-targets

  # A known-vulnerable dependency is a production problem regardless of how good the
  # language is.
  #
  # BLOCKING, which required first making it green. It shipped `continue-on-error: true`
  # and immediately went red on six advisories — and a job that is permanently red is
  # strictly worse than no job, because a SEVENTH advisory would appear among the six and
  # nobody would look. Two were closed by upgrading (crossbeam-epoch, quinn-proto); the
  # four that have no fix reachable from this dependency tree are listed in
  # `.cargo/audit.toml`, each with the blocking crate and the condition that clears it.
  # Nothing is silenced without a written reason, and a NEW advisory now fails CI.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: helix-audit
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # NON-DEFAULT FEATURES. Every other job in this file builds the default feature set, which
  # means `src/python.rs` — 700 lines of CPython interop behind the off-by-default `python`
  # feature — was compiled by NOTHING. `cargo build`, `cargo clippy --all-targets` and
  # `cargo check --all-targets` all pass with a non-exhaustive match in that file.
  #
  # That is not hypothetical: adding a variant to `ArrayData` produced 15 compile errors, 14
  # of which CI would have caught and the 15th of which was in `python.rs`. It was found by
  # running `cargo check --features python` by hand, and this job is so that nobody has to.
  #
  # `check` rather than `build`: it type-checks the file, which is the whole point, without
  # needing a libpython to link against.
  features:
    name: non-default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: helix-features
      - name: python interop
        run: cargo check --features python
      # `managed` (verified HTTPS downloads for runtimes/packages/toolchains) is the other
      # off-by-default feature, and is likewise built by no other job.
      - name: managed runtimes
        run: cargo check --features managed
      # And the allocator-debugging build, which is what `--no-default-features` is for.
      - name: no default features
        run: cargo check --no-default-features
      # ADR 0032: the appliance profile is a shipped configuration, so it gets the
      # strict treatment — clippy at -D warnings catches the cfg'd-out build's
      # dead-code/unused-import drift that nothing else compiles. The dataframes
      # axis alone guards the seam: one stray `use crate::backend::polars::...`
      # outside backend/polars.rs re-links 27 crates, and this cell is what notices.
      - name: appliance profile (clippy, deny warnings)
        run: cargo clippy --no-default-features --features appliance -- -D warnings
      # The dual-engine dev build (polars + native) is what the differential
      # campaign runs on — it must always compile.
      - name: dual DataFrame engines
        run: cargo clippy --features native-df -- -D warnings

  installer:
    name: install.sh logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.sh carries the repo's only version-comparison logic, and it runs on
      # every user's machine, under an unknown `sh`, before anything else can go
      # right. shellcheck it as POSIX sh, then table-test `version_lt` and the
      # glibc-floor routing with dash (the strictest common /bin/sh).
      - name: shellcheck (POSIX sh)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck dash
          shellcheck -s sh install.sh
      - name: version_lt table test (dash)
        run: |
          { sed -n '/^GLIBC_FLOOR=/p' install.sh
            sed -n '/^glibc_version() {/,/^}/p' install.sh
            sed -n '/^version_lt() {/,/^}/p' install.sh; } > /tmp/fns.sh
          dash -e -c '
            . /tmp/fns.sh
            fail=0
            t() {
              if version_lt "$1" "$2"; then got=lt; else got=ge; fi
              [ "$got" = "$3" ] || { echo "FAIL: $1 vs $2 -> $got (want $3)"; fail=1; }
            }
            t 2.17 2.35 lt;  t 2.28 2.35 lt;  t 2.31 2.35 lt;  t 2.34 2.35 lt
            t 2.35 2.35 ge;  t 2.36 2.35 ge;  t 2.39 2.35 ge;  t 3.0 2.35 ge
            t 2.4  2.35 lt;  t 2.35.1 2.35 ge;  t 3.0 3 ge;  t 2 2.35 lt
            case "$GLIBC_FLOOR" in
              [0-9]*.[0-9]*) ;;
              *) echo "FAIL: GLIBC_FLOOR must be MAJOR.MINOR, got: $GLIBC_FLOOR"; fail=1 ;;
            esac
            exit $fail
          '
